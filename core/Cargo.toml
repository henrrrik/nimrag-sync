[package]
name = "nimrag"
version = "0.1.0"
edition = "2024"

[lib]
# A static library for the Qt shell, and an rlib for tests and examples.
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"
lto = true

[dependencies]
base64 = "0.23.1"
libc = "0.2.191"
log = "0.4.35"
md5 = "0.8.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision", "preserve_order"] }
thiserror = "2.0.21"
ureq = "3.5.1"

[dev-dependencies]
tempfile = "3.27.0"
