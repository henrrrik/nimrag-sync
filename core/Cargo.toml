[package]
name = "nimrag"
version = "0.1.0"
edition = "2024"

[lib]
# A static library for the Qt shell, and an rlib for tests and examples.
crate-type = ["staticlib", "rlib"]

[profile.release]
panic = "abort"
lto = true

[dependencies]
libc = "0.2.191"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"

[dev-dependencies]
tempfile = "3.27.0"
