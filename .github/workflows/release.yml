name: Release

# Pushing a tag v<version> builds the Arch packages for both architectures and
# makes a GitHub release of them, its notes from docs/releases/v<version>.md.
# Started by hand it builds and gathers the packages but releases nothing.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  package:
    name: Package (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            image: archlinux:base-devel
          - arch: aarch64
            runner: ubuntu-24.04-arm
            image: menci/archlinuxarm:base-devel
    steps:
      - uses: actions/checkout@v7
      - name: Install build dependencies
        run: ci/arch-setup
      - name: Tests
        run: sudo -u builder env HOME=/home/builder bin/test
      - name: Package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
            grep -qx "pkgver=$version" pkgbuild/PKGBUILD || { echo "pkgbuild/PKGBUILD is not at $version"; exit 1; }
          fi
          cd pkgbuild
          sudo -u builder env HOME=/home/builder PKGEXT=.pkg.tar.zst makepkg -f
      - uses: actions/upload-artifact@v7
        with:
          name: package-${{ matrix.arch }}
          path: pkgbuild/*.pkg.tar.zst
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          pattern: package-*
          path: dist
          merge-multiple: true
      - name: Packages
        working-directory: dist
        run: sha256sum *.pkg.tar.zst | tee SHA256SUMS
      - name: Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          gh release create "$GITHUB_REF_NAME" *.pkg.tar.zst SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --title "nimrag-sync ${GITHUB_REF_NAME#v}" \
            --notes-file "../docs/releases/$GITHUB_REF_NAME.md"
